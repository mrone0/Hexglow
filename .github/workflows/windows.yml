name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and test Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Keep this aligned with the checked-in lockfile and local development.
      PNPM_VERSION: 11.7.0
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        # Do not approve or run dependency build scripts. The workspace's
        # pnpm allowBuilds policy intentionally remains unchanged.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build signed NSIS installer
        # bundle.createUpdaterArtifacts=true makes the build fail without a
        # signing key, so repository secrets must exist before the first run:
        #   TAURI_SIGNING_PRIVATE_KEY          (path or contents of the key)
        #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty when the key has none)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Generate updater latest.json
        # Verifies the .sig exists and writes latest.json (UTF-8, no BOM) next
        # to the installer; version comes from package.json.
        run: powershell -ExecutionPolicy Bypass -File scripts\make-latest-json.ps1

      - name: Upload signed NSIS installer and updater signature
        uses: actions/upload-artifact@v4
        with:
          name: hexglow-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$pkg") { throw "tag $tag does not match package.json version v$pkg" }

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: hexglow-windows-installer
          path: bundle

      - name: Create release with installer and latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $exe = @((Get-ChildItem -Recurse -Filter '*.exe' bundle).FullName)
          $sig = @((Get-ChildItem -Recurse -Filter '*.sig' bundle).FullName)
          $json = @((Get-ChildItem -Recurse -Filter 'latest.json' bundle).FullName)
          if (-not $exe -or -not $sig -or -not $json) {
            throw 'expected installer, .sig and latest.json in the artifact'
          }
          $assets = $exe + $sig + $json
          if (gh release view $tag --repo '${{ github.repository }}' 2>$null) {
            gh release upload $tag @assets --repo '${{ github.repository }}' --clobber
          } else {
            gh release create $tag @assets --repo '${{ github.repository }}' --title $tag --generate-notes
          }
